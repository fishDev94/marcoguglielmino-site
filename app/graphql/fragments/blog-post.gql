fragment BlogPostData on BlogPost {
  title
  slug
  seoTitle
  seoDescription
  tags
  publishedData
  coverImage {
    url
    title
    description
    width
    height
  }
  eventDate
  location
  typeOfRecord
  bodyDescription {
    json
    links {
      assets {
        block {
          sys {
            id
          }
          url
          title
          description
          width
          height
        }
      }
      entries {
        block {
          sys {
            id
          }
          __typename
          ... on StravaActivity {
            ...StravaActivityData
          }
        }
      }
    }
  }
  gallery: galleryCollection {
    items {
      title
      url
    }
  }
  equipment: equipmentCollection {
    items {
      ...EquipmentItemData
    }
  }
  performance {
    ...PerformanceCardData
  }
}