name: ci

on: push

jobs:
  ci:
    runs-on: ${{ matrix.os }}
    env:
      CTF_CDA_ACCESS_TOKEN: ${{ secrets.CTF_CDA_ACCESS_TOKEN }}
      CTF_CDA_SPACE_ID: ${{ secrets.CTF_CDA_SPACE_ID }}
      GRAPHQL_CLIENT_CLIENTS_DEFAULT: ${{ secrets.GRAPHQL_CLIENT_CLIENTS_DEFAULT }}
      GRAPHQL_CLIENT_CLIENTS_DEFAULT_TOKEN: ${{ secrets.GRAPHQL_CLIENT_CLIENTS_DEFAULT_TOKEN }}

    strategy:
      matrix:
        os: [ubuntu-latest]
        node: [22]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck
